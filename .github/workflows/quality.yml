name: Validate Aether & Ruin

on:
  # Keep the existing required PR check named "verify".
  pull_request:
    branches: [main]
  # Application and test changes use one validation run. Only app changes deploy.
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/quality.yml'
      - '.github/actions/**'
  # Manual rebuild and redeploy, including when there are no changed source files.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required to compare the entire pushed range, including merge commits.
          fetch-depth: 0

      - name: Determine whether the published application changed
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          publish=false
          while IFS= read -r -d '' changed; do
            case "$changed" in
              web/index.html|web/src/*|web/public/*|web/package.json|web/package-lock.json|web/npm-shrinkwrap.json|web/vite.config.*|web/svelte.config.*|web/tsconfig*.json|web/postcss.config.*|web/tailwind.config.*|web/scripts/*|.github/actions/*)
                publish=true
                break
                ;;
            esac
          done < <(git diff --name-only -z "$BEFORE_SHA" "$GITHUB_SHA")
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck Svelte/TypeScript
        working-directory: web
        run: npm run check

      - name: Unit tests
        working-directory: web
        run: npm run test

      - name: Build static game
        working-directory: web
        run: npm run build

      - name: Install headless Chromium
        working-directory: web
        run: npx playwright install --only-shell chromium

      - name: Browser tests
        working-directory: web
        run: npm run test:e2e

      - name: Legacy reference test
        run: node tests/site.test.mjs

      # Uploaded only from a fully verified push/dispatch, not from PRs or tests-only commits.
      - name: Save verified build for Pages
        if: steps.scope.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist-${{ github.sha }}
          path: web/dist
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified build for this exact SHA
        uses: actions/download-artifact@v4
        with:
          name: pages-dist-${{ github.sha }}
          path: web/dist

      - name: Verify Pages base path
        run: |
          test -s web/dist/index.html
          grep -q '/dark_fantasy_2d_arpg/' web/dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      # Preserve the API indexing guard from the previous Pages workflow.
      - name: Wait for Pages artifact to appear in GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                --jq '.artifacts[] | select(.name == "github-pages") | .id' | grep -q .; then
              echo 'Pages artifact indexed'
              exit 0
            fi
            echo "Pages artifact not indexed yet (attempt $attempt)"
            sleep 5
          done
          echo '::error::GitHub Pages artifact did not become visible'
          exit 1

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
