name: Validate Aether & Ruin

on:
  # Always produce a reliable PR check, even for documentation-only PRs.
  pull_request:
    branches: [main]
  # Staging changes are tested without triggering the Pages deploy workflow.
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/quality.yml'

permissions:
  contents: read

jobs:
  legacy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate published legacy engine
        run: node tests/site.test.mjs

  staging-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install staging dependencies
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Typecheck Svelte and TypeScript
        working-directory: web
        run: npm run check
      - name: Test simulation and localization
        working-directory: web
        run: npm run test
      - name: Compile Vite production bundle
        working-directory: web
        run: npm run build
      - name: Verify static output
        run: |
          test -s web/dist/index.html
          grep -q '/dark_fantasy_2d_arpg/' web/dist/index.html

  # Generate the initial npm lockfile on a trusted main-branch push only,
  # after the staging checks succeeded. Subsequent installs use npm ci.
  lockfile-bootstrap:
    needs: staging-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Commit initial dependency lockfile if missing
        working-directory: web
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(web): lock staging dependencies [skip ci]"
            git push
          fi
  browser-smoke:
    needs: staging-check
    # Playwright 1.56 browser bundles do not yet support Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked staging dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install chromium --with-deps
      - name: Build browser app
        working-directory: web
        run: npm run build
      - name: Playwright locale/gameplay boot smoke test
        working-directory: web
        run: npm run test:e2e
      - name: Upload failing browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-playwright-failure
          path: web/test-results/
          if-no-files-found: ignore
