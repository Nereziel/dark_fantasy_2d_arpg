name: Validate Aether & Ruin

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/**'
      - 'dark_fantasy_2d_arpg_engine.html'
      - 'index.html'
      - 'visuals.js'
      - 'visuals.css'
      - '.github/workflows/quality.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Full regression (any branch) or Pages recovery (main only)'
        type: choice
        options: [full, publish]
        default: full
        required: true

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
  cancel-in-progress: true

jobs:
  # One runner, one checkout, one npm installation and one build per ready PR.
  # Drafts do not consume hosted runners. Mark ready before requesting CI.
  verify:
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 60 || 15 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Validate workflow and legacy reference
        run: |
          bash tests/publish-scope.test.sh
          bash tests/quality-validation.test.sh
          bash tests/validation-scope.test.sh
          node --test tests/browser-timings.test.mjs
          node tests/site.test.mjs
      - name: Typecheck
        working-directory: web
        run: npm run check
      - name: All unit tests
        working-directory: web
        run: npm run test
      - name: Build static game
        working-directory: web
        run: npm run build
      - name: Install headless Chromium
        working-directory: web
        run: npx playwright install --only-shell chromium
      - name: Browser smoke (automatic PR gate)
        if: github.event_name == 'pull_request'
        working-directory: web
        run: npm run test:e2e -- tests/e2e/ci-smoke.spec.ts --workers=1 --retries=0
      - name: Full browser regression (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        working-directory: web
        run: npm run test:e2e -- --grep-invert 'natural first Act I loop:' --workers=1 --retries=0
      - name: Natural Act I progression (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        working-directory: web
        env:
          LANE: act-i
        run: npm run test:e2e -- --grep 'natural first Act I loop:' --workers=1 --retries=0
      - name: Retain failing browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 2

  # Main publication does not repeat PR tests. Preserve recovery scope and
  # exact-artifact publication; skip installation/build if no publish needed.
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
      bundle: game-dist-${{ github.sha }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine whether the published application changed
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/actions/publish-scope.sh
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.publish == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        if: steps.scope.outputs.publish == 'true'
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build static game
        if: steps.scope.outputs.publish == 'true'
        working-directory: web
        run: npm run build
      - name: Upload production bundle
        if: steps.scope.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: game-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.result == 'success' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download exact production bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.bundle }}
          path: web/dist

      - name: Verify Pages base path
        run: |
          test -s web/dist/index.html
          grep -q '/dark_fantasy_2d_arpg/' web/dist/index.html

      - name: Upload playtest Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ github.sha }}-${{ github.run_attempt }}
          path: web/dist
          retention-days: 1

      - name: Record temporary deployment policy
        run: |
          echo '### Playtest deployment: successful build; PR gate and manual full regression are separate.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A published build is not proof of passing tests or release acceptance.' >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.sha }}-${{ github.run_attempt }}
