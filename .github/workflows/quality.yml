name: Validate Aether & Ruin

on:
  # Required PR quality check runs even when only docs change.
  pull_request:
    branches: [main]
  # Test/config-only pushes need checks, but must not redeploy Pages.
  push:
    branches: [main]
    paths:
      - 'web/tests/**'
      - 'tests/**'
      - '.github/workflows/quality.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: web
        run: npm run check
      - name: Unit tests
        working-directory: web
        run: npm run test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install chromium
      - name: Browser tests
        working-directory: web
        run: npm run test:e2e
      - name: Legacy reference test
        run: node tests/site.test.mjs
