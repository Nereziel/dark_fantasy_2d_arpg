name: Validate Aether & Ruin

on:
  # Keep the existing required PR check named "verify".
  pull_request:
    branches: [main]
  # Application and test changes use one validation run; recover missed publishes.
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/**'
      # Changes to the archived HTML prototype still receive a validation run.
      - 'dark_fantasy_2d_arpg_engine.html'
      - 'index.html'
      - 'visuals.js'
      - 'visuals.css'
      - '.github/workflows/quality.yml'
      - '.github/actions/**'
  # Manual rebuild and redeploy, including when there are no changed source files.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: read
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
      bundle: game-dist-${{ github.sha }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required to compare the entire pushed range, including merge commits.
          fetch-depth: 0

      - name: Determine whether the published application changed
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/actions/publish-scope.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build static game
        working-directory: web
        run: npm run build

      # One production build is shared by every browser lane, not rebuilt.
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: game-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: web/dist
          if-no-files-found: error
          retention-days: 3

  # Independent checks run alongside the build, not on the browser critical path.
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required to compare the entire pushed range, including merge commits.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test deployment scope and recovery
        run: bash tests/publish-scope.test.sh

      - name: Test mandatory validation gate
        run: bash tests/quality-validation.test.sh

      - name: Test browser timing report
        run: node --test tests/browser-timings.test.mjs

      - name: Typecheck Svelte/TypeScript
        working-directory: web
        run: npm run check

      - name: Unit tests
        working-directory: web
        run: npm run test

      - name: Check whether the archived HTML reference changed
        id: legacy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Check a PR's changes against its base, or a pushed commit range.
          # If the range is unavailable, run the test rather than silently skip it.
          run_legacy=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            before="$PR_BASE_SHA"
            after="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            before="$BEFORE_SHA"
            after="$GITHUB_SHA"
          else
            before=""
            after=""
          fi
          if [[ -n "$before" && -n "$after" && ! "$before" =~ ^0+$ ]] \
            && git cat-file -e "${before}^{commit}" 2>/dev/null \
            && git cat-file -e "${after}^{commit}" 2>/dev/null; then
            if git diff --quiet --no-renames "$before" "$after" -- \
              dark_fantasy_2d_arpg_engine.html index.html visuals.js visuals.css tests/site.test.mjs; then
              run_legacy=false
            fi
          fi
          echo "run=$run_legacy" >> "$GITHUB_OUTPUT"

      - name: Legacy reference test
        if: steps.legacy.outputs.run == 'true'
        run: node tests/site.test.mjs

  browser:
    name: Browser (${{ matrix.lane }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: quick-1
            shard: 1/6
          - lane: quick-2
            shard: 2/6
          - lane: quick-3
            shard: 3/6
          - lane: quick-4
            shard: 4/6
          - lane: quick-5
            shard: 5/6
          - lane: quick-6
            shard: 6/6
          - lane: act-i
            shard: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download exact production bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.bundle }}
          path: web/dist

      - name: Install headless Chromium
        working-directory: web
        run: npx playwright install --only-shell chromium

      - name: Browser tests
        working-directory: web
        env:
          LANE: ${{ matrix.lane }}
          SHARD: ${{ matrix.shard }}
        run: |
          # Complementary filters: every test runs exactly once across the
          # lanes. The touch-loot case in the same file stays in quick tests.
          # Each quick runner uses one renderer-heavy browser worker; test-level
          # sharding balances large spec files without sharing browser state.
          if [[ "$LANE" == "act-i" ]]; then
            npm run test:e2e -- --grep 'natural first Act I loop:' --workers=1 --retries=0
          else
            npm run test:e2e -- --grep-invert 'natural first Act I loop:' --shard="$SHARD" --workers=1 --fully-parallel
          fi

      - name: Report slow tests and retries
        if: ${{ always() && !cancelled() }}
        run: node .github/actions/browser-timings.mjs web/test-results/ci-results.json '${{ matrix.lane }}'

      - name: Retain failing browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.lane }}-${{ github.run_attempt }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the required check name. No skipped/failed lane can publish.
  verify:
    needs: [build, checks, browser]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ needs.build.outputs.publish }}
      pages_artifact: pages-${{ github.sha }}-${{ github.run_attempt }}
    steps:
      - name: Checkout validation gate
        uses: actions/checkout@v4

      - name: Require all validation lanes
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: bash .github/actions/require-validation.sh "$BUILD_RESULT" "$CHECKS_RESULT" "$BROWSER_RESULT"

      - name: Download verified production bundle
        if: needs.build.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.bundle }}
          path: web/dist

      - name: Verify Pages base path
        if: needs.build.outputs.publish == 'true'
        run: |
          test -s web/dist/index.html
          grep -q '/dark_fantasy_2d_arpg/' web/dist/index.html

      # Publish the verified bundle once. Re-running only deploy reuses this
      # exact job output and never creates a duplicate Pages artifact.
      - name: Upload verified Pages artifact
        if: needs.build.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ github.sha }}-${{ github.run_attempt }}
          path: web/dist
          retention-days: 3

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.verify.outputs.pages_artifact }}
