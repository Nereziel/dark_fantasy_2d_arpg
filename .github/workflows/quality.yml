name: Validate Aether & Ruin

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/**'
      - 'dark_fantasy_2d_arpg_engine.html'
      - 'index.html'
      - 'visuals.js'
      - 'visuals.css'
      - '.github/workflows/quality.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Full regression (any branch) or Pages recovery (main only)'
        type: choice
        options: [full, publish]
        default: full
        required: true

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
  cancel-in-progress: true

jobs:
  # Shared exact build; no validation on draft or main publication.
  build:
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full') || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
      validate: ${{ steps.scope.outputs.validate }}
      bundle: game-dist-${{ github.sha }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine whether the published application changed
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          VALIDATE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full') }}
        run: |
          echo "validate=$VALIDATE" >> "$GITHUB_OUTPUT"
          if [[ "$VALIDATE" == true ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            bash .github/actions/publish-scope.sh
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.publish == 'true' || steps.scope.outputs.validate == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        if: steps.scope.outputs.publish == 'true' || steps.scope.outputs.validate == 'true'
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build static game
        if: steps.scope.outputs.publish == 'true' || steps.scope.outputs.validate == 'true'
        working-directory: web
        run: npm run build
      - name: Upload production bundle
        if: steps.scope.outputs.publish == 'true' || steps.scope.outputs.validate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: game-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: web/dist
          if-no-files-found: error
          retention-days: 3

  checks:
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required to compare the entire pushed range, including merge commits.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test deployment scope and recovery
        run: bash tests/publish-scope.test.sh

      - name: Test mandatory validation gate
        run: bash tests/quality-validation.test.sh

      - name: Test validation scope classification
        run: bash tests/validation-scope.test.sh

      - name: Test browser timing report
        run: node --test tests/browser-timings.test.mjs

      - name: Typecheck Svelte/TypeScript
        working-directory: web
        run: npm run check

      - name: Unit tests
        working-directory: web
        run: npm run test

      - name: Check whether the archived HTML reference changed
        id: legacy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Check a PR's changes against its base, or a pushed commit range.
          # If the range is unavailable, run the test rather than silently skip it.
          run_legacy=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            before="$PR_BASE_SHA"
            after="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            before="$BEFORE_SHA"
            after="$GITHUB_SHA"
          else
            before=""
            after=""
          fi
          if [[ -n "$before" && -n "$after" && ! "$before" =~ ^0+$ ]] \
            && git cat-file -e "${before}^{commit}" 2>/dev/null \
            && git cat-file -e "${after}^{commit}" 2>/dev/null; then
            if git diff --quiet --no-renames "$before" "$after" -- \
              dark_fantasy_2d_arpg_engine.html index.html visuals.js visuals.css tests/site.test.mjs; then
              run_legacy=false
            fi
          fi
          echo "run=$run_legacy" >> "$GITHUB_OUTPUT"

      - name: Legacy reference test
        if: steps.legacy.outputs.run == 'true'
        run: node tests/site.test.mjs

  browser:
    name: Browser (${{ matrix.lane }})
    needs: build
    if: needs.build.outputs.validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        lane: [quick-1, quick-2, quick-3, quick-4, act-i]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download exact production bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.bundle }}
          path: web/dist

      - name: Install headless Chromium
        working-directory: web
        run: npx playwright install --only-shell chromium

      - name: Browser tests
        working-directory: web
        env:
          LANE: ${{ matrix.lane }}
        run: |
          # Four disjoint shards plus one natural Act I lane. No blind retries.
          if [[ "$LANE" == "act-i" ]]; then
            npm run test:e2e -- --grep 'natural first Act I loop:' --workers=1 --retries=0
          else
            SHARD=${LANE#quick-}
            npm run test:e2e -- --grep-invert 'natural first Act I loop:' --shard="$SHARD/4" --workers=1 --fully-parallel --retries=0
          fi

      - name: Report slow tests and retries
        if: ${{ always() && !cancelled() }}
        run: node .github/actions/browser-timings.mjs web/test-results/ci-results.json '${{ matrix.lane }}'

      - name: Retain failing browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.lane }}-${{ github.run_attempt }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 3

  verify:
    needs: [build, checks, browser]
    if: ${{ always() && !cancelled() && ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout validation gate
        uses: actions/checkout@v4

      - name: Require all validation lanes
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          bash .github/actions/require-validation.sh "$BUILD_RESULT" "$CHECKS_RESULT" "$BROWSER_RESULT"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.result == 'success' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download exact production bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.bundle }}
          path: web/dist

      - name: Verify Pages base path
        run: |
          test -s web/dist/index.html
          grep -q '/dark_fantasy_2d_arpg/' web/dist/index.html

      - name: Upload playtest Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ github.sha }}-${{ github.run_attempt }}
          path: web/dist
          retention-days: 3

      - name: Record temporary deployment policy
        run: |
          echo '### Playtest deployment: successful build; full PR validation and publication are separate.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A published build is not proof of passing tests or release acceptance.' >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.sha }}-${{ github.run_attempt }}
