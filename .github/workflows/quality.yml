name: Validate Aether & Ruin

on:
  # Keep the existing required PR check named "verify".
  pull_request:
    branches: [main]
  # Application and test changes use one validation run. Only app changes deploy.
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/**'
      # Changes to the archived HTML prototype still receive a validation run.
      - 'dark_fantasy_2d_arpg_engine.html'
      - 'index.html'
      - 'visuals.js'
      - 'visuals.css'
      - '.github/workflows/quality.yml'
      - '.github/actions/**'
  # Manual rebuild and redeploy, including when there are no changed source files.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
      pages_artifact: pages-${{ github.sha }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required to compare the entire pushed range, including merge commits.
          fetch-depth: 0

      - name: Determine whether the published application changed
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          publish=false
          while IFS= read -r -d '' changed; do
            case "$changed" in
              web/index.html|web/src/*|web/public/*|web/package.json|web/package-lock.json|web/npm-shrinkwrap.json|web/vite.config.*|web/svelte.config.*|web/tsconfig*.json|web/postcss.config.*|web/tailwind.config.*|web/scripts/*|.github/actions/*|.github/workflows/quality.yml)
                publish=true
                break
                ;;
            esac
          done < <(git diff --name-only -z "$BEFORE_SHA" "$GITHUB_SHA")
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck Svelte/TypeScript
        working-directory: web
        run: npm run check

      - name: Unit tests
        working-directory: web
        run: npm run test

      - name: Build static game
        working-directory: web
        run: npm run build

      - name: Install headless Chromium
        working-directory: web
        run: npx playwright install --only-shell chromium

      - name: Browser tests
        working-directory: web
        run: npm run test:e2e

      - name: Check whether the archived HTML reference changed
        id: legacy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Check a PR's changes against its base, or a pushed commit range.
          # If the range is unavailable, run the test rather than silently skip it.
          run_legacy=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            before="$PR_BASE_SHA"
            after="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            before="$BEFORE_SHA"
            after="$GITHUB_SHA"
          else
            before=""
            after=""
          fi
          if [[ -n "$before" && -n "$after" && ! "$before" =~ ^0+$ ]] \
            && git cat-file -e "${before}^{commit}" 2>/dev/null \
            && git cat-file -e "${after}^{commit}" 2>/dev/null; then
            if git diff --quiet --no-renames "$before" "$after" -- \
              dark_fantasy_2d_arpg_engine.html index.html visuals.js visuals.css tests/site.test.mjs; then
              run_legacy=false
            fi
          fi
          echo "run=$run_legacy" >> "$GITHUB_OUTPUT"

      - name: Legacy reference test
        if: steps.legacy.outputs.run == 'true'
        run: node tests/site.test.mjs

      - name: Verify Pages base path
        if: steps.scope.outputs.publish == 'true'
        run: |
          test -s web/dist/index.html
          grep -q '/dark_fantasy_2d_arpg/' web/dist/index.html

      # Publish the verified bundle once. Re-running only deploy reuses this
      # exact job output and never creates a duplicate Pages artifact.
      - name: Upload verified Pages artifact
        if: steps.scope.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ github.sha }}-${{ github.run_attempt }}
          path: web/dist
          retention-days: 3

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.verify.outputs.pages_artifact }}
