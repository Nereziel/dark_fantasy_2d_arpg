name: Act I extended seed sweep

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: act1-seed-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed-sweep:
    name: Seed sweep (1000 seeds, serial batches)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Strict Act I terrain, content and all three dungeons
        env:
          SEED_SWEEP_COUNT: '250'
          SEED_SWEEP_REQUIRE_VILLAGES: '1'
        run: |
          set -o pipefail
          # Preserve all four disjoint 250-seed batches, without four runners.
          for start in 0 1979750 3959500 5939250; do
            echo "Seed batch start=$start" | tee -a seed-sweep.log
            SEED_SWEEP_START="$start" npm test -- tests/unit/Issue113SeedValidation.test.ts 2>&1 | tee -a seed-sweep.log
          done
      - name: Save diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seed-sweep-${{ github.run_attempt }}
          path: web/seed-sweep.log
          if-no-files-found: warn
          retention-days: 2
