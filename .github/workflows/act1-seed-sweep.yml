name: Act I extended seed sweep

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/act1-seed-sweep.yml'
      - 'web/tests/unit/Issue113SeedValidation.test.ts'

permissions:
  contents: read

concurrency:
  group: act1-seed-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed-sweep:
    name: Seed sweep (${{ matrix.start }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # 1000 distinct seeds in the existing 7919-step sequence.
        # Each shard also replays the fixed boundary samples.
        start: [0, 1979750, 3959500, 5939250]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Strict Act I terrain, content and all three dungeons
        env:
          SEED_SWEEP_START: ${{ matrix.start }}
          SEED_SWEEP_COUNT: '250'
          SEED_SWEEP_REQUIRE_VILLAGES: '1'
        run: |
          set -o pipefail
          npm test -- tests/unit/Issue113SeedValidation.test.ts 2>&1 | tee seed-sweep.log
      - name: Save diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-sweep-${{ matrix.start }}
          path: web/seed-sweep.log
          if-no-files-found: warn
          retention-days: 7
