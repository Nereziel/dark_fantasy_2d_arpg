name: Deploy Aether & Ruin (Svelte + Phaser) to GitHub Pages

on:
  push:
    branches: [main]
    # Only published application sources, asset inputs and deploy config.
    # Documentation/test-only commits do not rebuild GitHub Pages.
    paths:
      - 'web/index.html'
      - 'web/src/**'
      - 'web/public/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/npm-shrinkwrap.json'
      - 'web/vite.config.*'
      - 'web/svelte.config.*'
      - 'web/tsconfig*.json'
      - 'web/postcss.config.*'
      - 'web/tailwind.config.*'
      - 'web/scripts/**'
      - '.github/workflows/pages.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Typecheck Svelte/TypeScript
        working-directory: web
        run: npm run check

      - name: Run gameplay and localization unit tests
        working-directory: web
        run: npm run test

      - name: Build Vite static SPA
        working-directory: web
        run: npm run build

      - name: Verify Pages asset base path
        run: |
          test -s web/dist/index.html
          grep -q '/dark_fantasy_2d_arpg/' web/dist/index.html

      - name: Install Chromium
        working-directory: web
        run: npx playwright install chromium --with-deps

      - name: Browser smoke test
        working-directory: web
        run: npm run test:e2e

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload built game only
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
