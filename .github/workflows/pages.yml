name: Deploy Aether & Ruin to GitHub Pages

on:
  push:
    branches: [main]
    # Build/deploy only when the published game or its build configuration changes.
    # README.md, implementation prompts, docs/ and test-only commits do not deploy.
    paths:
      # Current published HTML5 Canvas game (legacy, until Svelte/Phaser cutover)
      - 'index.html'
      - 'dark_fantasy_2d_arpg_engine.html'
      - 'visuals.js'
      - 'visuals.css'
      - 'assets/**'

      # Future root-level Vite app (if migrated to repository root)
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - 'vite.config.*'
      - 'svelte.config.*'
      - 'tsconfig*.json'
      - 'postcss.config.*'
      - 'tailwind.config.*'
      - 'scripts/**'

      # Side-by-side Svelte/Phaser app during migration
      - 'web/index.html'
      - 'web/src/**'
      - 'web/public/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/npm-shrinkwrap.json'
      - 'web/vite.config.*'
      - 'web/svelte.config.*'
      - 'web/tsconfig*.json'
      - 'web/postcss.config.*'
      - 'web/tailwind.config.*'
      - 'web/scripts/**'

      # Changing deployment configuration must also trigger deployment.
      - '.github/workflows/pages.yml'
      - '.github/actions/**'

  # Intentional manual redeploy is always possible (ignores push path filters).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      # Legacy static site validation. During the Svelte/Phaser cutover,
      # replace this with npm ci/check/test/build and publish web/dist.
      - name: Validate source and scripts
        run: node tests/site.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
