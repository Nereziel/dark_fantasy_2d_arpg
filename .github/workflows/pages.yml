name: Deploy Aether & Ruin to GitHub Pages

on:
  push:
    branches: [main]
    # Only changes to the CURRENTLY PUBLISHED game trigger deployment.
    # Docs, README, implementation prompts, tests and the future web/ staging
    # app do not redeploy the legacy site. Switch this list on migration cutover.
    paths:
      - 'index.html'
      - 'dark_fantasy_2d_arpg_engine.html'
      - 'visuals.js'
      - 'visuals.css'
      - 'assets/**'
      - '.github/workflows/pages.yml'
      - '.github/actions/**'

  # Deliberate manual redeploy, even when no game files changed.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      # Legacy static site validation. At the Svelte/Phaser cutover, replace
      # with npm ci/check/test/build in web/ and upload web/dist below.
      - name: Validate source and scripts
        run: node tests/site.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
